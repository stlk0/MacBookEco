name: Display profile for another Mac
description: Propose a tested 48 Hz profile for unsupported hardware.
labels: ["display-profile"]
body:
  - type: markdown
    attributes:
      value: |
        Submit evidence from the actual machine, not a calculated modeline.
        Do not attach a raw EDID dump. Redact serial numbers and the
        instance-specific suffix of device IDs from all supporting evidence.

  - type: input
    id: model
    attributes:
      label: Apple SMBIOS model
      placeholder: MacBookPro16,1
    validations:
      required: true

  - type: input
    id: panel
    attributes:
      label: Panel hardware ID
      placeholder: APPA044
    validations:
      required: true

  - type: input
    id: native
    attributes:
      label: Native timing
      placeholder: 3072x1920 @ 60 Hz
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Public-safe display diagnostics
      description: |
        Paste the complete display profile compatibility report from MacBook
        Eco. It includes a sanitized profile fixture and contains no raw EDID
        or per-device serial number.
      render: text
    validations:
      required: true

  - type: input
    id: candidate-dtd
    attributes:
      label: Tested candidate 48 Hz DTD
      description: Provide the exact 18 hexadecimal bytes tested on this machine.
      placeholder: DC 91 00 50 C0 80 24 72 08 20 98 08 59 D7 10 00 00 1A
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU device and driver
      placeholder: AMD Radeon Pro 5300M, VEN_1002&DEV_7340, 30.0.13045.22003
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Verification on the actual machine
      options:
        - label: Native 60 Hz remained available
          required: true
        - label: Confirmation timeout restored the previous mode
          required: true
        - label: Removal restored the original state after restart
          required: true
        - label: The picture was checked after a cold boot
          required: true

  - type: textarea
    id: telemetry
    attributes:
      label: Before and after telemetry
      description: Include power source, load, brightness, and sample duration.
    validations:
      required: true

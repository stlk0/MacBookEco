name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Host-safe build and package
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and run host-safe suites
        shell: powershell
        run: .\tests\test-all.ps1

      - name: Build installer and commit-based source archive
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            .\build\package.ps1 -OfficialRelease
          }
          else {
            .\build\package.ps1
          }

      - name: Verify extracted source archive
        shell: powershell
        run: |
          $archive = Get-ChildItem build\release\*-source.zip | Select-Object -First 1
          if ($null -eq $archive) { throw 'Source archive was not produced.' }
          $destination = Join-Path $env:RUNNER_TEMP 'MacBookEco-source-check'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force
          $sourceRoot = Get-ChildItem $destination -Directory | Select-Object -First 1
          if ($null -eq $sourceRoot) { throw 'Source archive has no top-level directory.' }
          Push-Location $sourceRoot.FullName
          try {
            .\tests\test-all.ps1
          }
          finally {
            Pop-Location
          }

      - name: Upload package verification artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-verification
          path: |
            build/release/*-setup.exe
            build/release/*-setup.exe.sha256
            build/release/*-source.zip
            build/release/*-source.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Create draft prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-verification
          path: release

      - name: Create draft prerelease from verified package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseDirectory = (Resolve-Path -LiteralPath release).Path
          $assets = @(
            Join-Path $releaseDirectory "MacBookEco-$version-win-x64-setup.exe"
            Join-Path $releaseDirectory "MacBookEco-$version-win-x64-setup.exe.sha256"
            Join-Path $releaseDirectory "MacBookEco-$version-source.zip"
            Join-Path $releaseDirectory "MacBookEco-$version-source.zip.sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Verified release asset was not found: $asset"
            }
          }
          $policyUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/" +
            "$env:GITHUB_REF_NAME/docs/CODE_SIGNING.md"
          $releaseNotes = @(
            '## Code signing policy'
            ''
            "Review the [code signing policy]($policyUrl) before downloading."
            'Current unsigned releases are identified there; signed releases'
            'must have valid Authenticode signatures.'
          ) -join [Environment]::NewLine
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--repo', $env:GITHUB_REPOSITORY,
            '--draft', '--prerelease',
            '--title', "MacBook Eco $version",
            '--generate-notes',
            '--notes', $releaseNotes
          ) + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
